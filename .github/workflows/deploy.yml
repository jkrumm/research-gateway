name: Deploy

on:
  push:
    branches: [master]
    # A deploy restarts the container. Since 2026-09-08 SIGTERM drains rather than kills, so an
    # in-flight job usually survives — but only until SHUTDOWN_DRAIN_MS, and job durability is
    # still status-only: a job that outruns the window is reaped to error, never resumed. A
    # documentation commit has no business risking that, and this was never hypothetical — a
    # README-only push during a 15-run benchmark killed the run that was executing, back when
    # every deploy killed everything.
    #
    # Only markdown and repo metadata. The compose file and .env.tpl live in the vps repo,
    # so nothing deploy-shaped is left here to accidentally match.
    #
    # lightpanda/ is ignored here for the same reason: the renderer is a separate image with
    # its own workflow (deploy-lightpanda.yml), and restarting the gateway to ship a change
    # that is not in the gateway image is the exact mistake this list exists to prevent.
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
      - 'lightpanda/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Gate the deploy on the checks that catch the failures worth catching here: a type
  # error, and a regression in the grounding invariants that decide whether a citation
  # may be emitted. Both run without any secret — the pure modules are deliberately kept
  # free of the env/LLM import chain — so there is no reason not to gate on them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jkrumm/rollhook-action@v1
        with:
          url: https://rollhook.jkrumm.com
          image_name: research-gateway
          dockerfile: Dockerfile
          context: .
