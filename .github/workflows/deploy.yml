name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Gate the deploy on the checks that catch the failures worth catching here: a type
  # error, and a regression in the grounding invariants that decide whether a citation
  # may be emitted. Both run without any secret — the pure modules are deliberately kept
  # free of the env/LLM import chain — so there is no reason not to gate on them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jkrumm/rollhook-action@v1
        with:
          url: https://rollhook.jkrumm.com
          image_name: research-gateway
          dockerfile: Dockerfile
          context: .
