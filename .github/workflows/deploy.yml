name: Deploy

on:
  push:
    branches: [master]
    # A deploy restarts the container, and the job store is in-memory — so any in-flight
    # research job is LOST, not just delayed (a deep run is 10-20 minutes of work). A
    # documentation commit has no business doing that. This was not hypothetical: a
    # README-only push during a 15-run benchmark killed the run that was executing.
    #
    # Only markdown and repo metadata. deploy/compose.yml and deploy/.env.tpl are not .md,
    # so a real deployment change still triggers normally.
    #
    # lightpanda/ is ignored here for the same reason: the renderer is a separate image with
    # its own workflow (deploy-lightpanda.yml), and restarting the gateway to ship a change
    # that is not in the gateway image is the exact mistake this list exists to prevent.
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
      - 'lightpanda/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Gate the deploy on the checks that catch the failures worth catching here: a type
  # error, and a regression in the grounding invariants that decide whether a citation
  # may be emitted. Both run without any secret — the pure modules are deliberately kept
  # free of the env/LLM import chain — so there is no reason not to gate on them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jkrumm/rollhook-action@v1
        with:
          url: https://rollhook.jkrumm.com
          image_name: research-gateway
          dockerfile: Dockerfile
          context: .
